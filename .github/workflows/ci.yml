name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Ubuntu: the only platform previously actually verified (it's the dev
  # machine). Installs OCCT too, so this job covers the full 2D+3D build.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 + OpenCASCADE
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev ninja-build
          # OCCT (3D modeling core) is optional -- CMake's find_package(...
          # QUIET) skips it cleanly if these packages aren't available on
          # this runner image, so don't fail the job if apt can't find them.
          sudo apt-get install -y --no-install-recommends \
            libocct-foundation-dev libocct-modeling-algorithms-dev \
            libocct-modeling-data-dev libocct-ocaf-dev \
            libocct-visualization-dev libocct-data-exchange-dev || true

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Windows: previously only cross-compiled from Linux and never actually
  # run on real Windows. This job is the first real verification of that.
  # OCCT is skipped here (vcpkg's build is very slow) -- the 3D core is
  # optional and CMake disables it cleanly when OpenCASCADE isn't found.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          arch: win64_msvc2019_64
          cache: true

      - name: Configure
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # macOS: previously had no packaging or CI coverage at all.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 + OpenCASCADE
        run: brew install qt opencascade ninja

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
